[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# e2e (browser) tests are excluded by default — run them with: pytest -m e2e
addopts = -m "not e2e"
markers =
    e2e: end-to-end browser tests (require a live server + chromium)
    no_ai_mock: opt out of the autouse AI stub (test the real ai._ask wiring)
filterwarnings =
    ignore::FutureWarning
